name: Haskell
on:
  - push
  - pull_request

env:
  project-cabal-file: sectile.cabal

jobs:
  generate-matrix:
    name: "Generate matrix from cabal"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract the tested GHC versions
        id: set-matrix
        uses: kleidukos/get-tested@33b05af03a3fd3ad313cfbff4434ca12da5c84da
        with:
          cabal-file: ${{ env.project-cabal-file }}
          ubuntu-version: "latest"
          version: 0.1.7.1
  tests:
    name: ${{ matrix.ghc }} on ${{ matrix.os }}
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.10"

      - name: Restore build and dependency cache
        uses: actions/cache/restore@v6
        id: restore-build-cache
        with:
          key: build-${{ matrix.os }}-${{ matrix.ghc }}-${{ hashFiles(env.project-cabal-file) }}
          restore-keys: |
            build-${{ matrix.os }}-${{ matrix.ghc }}-
          path: |
            ~/.cabal/config
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcre3-dev

      - name: Build dependencies
        run: |
          cabal update
          cabal v2-build all --enable-tests --enable-benchmarks --only-dependencies
          cabal install hspec-discover --overwrite-policy=never

      - name: Build
        run: cabal v2-build all --enable-tests --enable-benchmarks

      - name: Run test
        run: cabal v2-test all --enable-tests --enable-benchmarks

      - uses: actions/cache/save@v6
        if: always()
        with:
          key: ${{ steps.restore-build-cache.outputs.cache-primary-key }}
          path: |
            ~/.cabal/config
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
